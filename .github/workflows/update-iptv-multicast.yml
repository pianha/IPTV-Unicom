name: Update IPTV-Unicom-Multicast

on:
  schedule:
    # 每天北京时间 07:00
    # GitHub Actions 使用 UTC，北京时间 = UTC+8
    - cron: "0 23 * * *"

  # 允许手动运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download and validate IPTV file
        shell: bash
        run: |
          set +e

          URL="https://raw.githubusercontent.com/qwerttvv/Beijing-IPTV/master/IPTV-Unicom-Multicast.m3u"
          FILE="IPTV-Unicom-Multicast.m3u"
          TEMP="IPTV-Unicom-Multicast.m3u.tmp"

          echo "Downloading IPTV-Unicom-Multicast.m3u..."

          # 下载到临时文件，避免下载失败破坏现有文件
          curl -fL --connect-timeout 20 --max-time 120 "$URL" -o "$TEMP"

          if [ $? -ne 0 ]; then
            echo "Download failed. Skipping update."
            rm -f "$TEMP"
            exit 0
          fi

          # 文件不能为空
          if [ ! -s "$TEMP" ]; then
            echo "Downloaded file is empty. Skipping update."
            rm -f "$TEMP"
            exit 0
          fi

          # 必须包含 M3U 标识
          if ! head -n 5 "$TEMP" | grep -q "#EXTM3U"; then
            echo "Downloaded file does not appear to be a valid M3U file. Skipping update."
            rm -f "$TEMP"
            exit 0
          fi

          # 检查通过后正式覆盖
          mv "$TEMP" "$FILE"

          echo "IPTV-Unicom-Multicast.m3u updated successfully."

      - name: Commit changes
        shell: bash
        run: |
          set +e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add IPTV-Unicom-Multicast.m3u

          # 没有变化就不提交
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update IPTV-Unicom-Multicast.m3u"

          if [ $? -ne 0 ]; then
            echo "Commit failed. Ignoring error."
            exit 0
          fi

          git push

          if [ $? -ne 0 ]; then
            echo "Push failed. Ignoring error."
            exit 0
          fi

          echo "Update completed successfully."
