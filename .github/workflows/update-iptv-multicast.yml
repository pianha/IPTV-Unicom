name: Update IPTV-Unicom-Multicast

on:
  schedule:
    # 每天北京时间 07:00
    # GitHub Actions 使用 UTC，北京时间 = UTC+8
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download and process IPTV-Unicom-Multicast.m3u
        shell: bash
        run: |
          set -e

          URL="https://raw.githubusercontent.com/qwerttvv/Beijing-IPTV/master/IPTV-Unicom-Multicast.m3u"
          FILE="IPTV-Unicom-Multicast.m3u"
          TEMP="IPTV-Unicom-Multicast.m3u.tmp"

          echo "Downloading..."

          curl -fL \
            --connect-timeout 20 \
            --max-time 120 \
            "$URL" \
            -o "$TEMP"

          echo "Download completed."

          # 该频道节目单尚无 → 后面的频道名称
          python3 <<'PY'
          import re

          file = "IPTV-Unicom-Multicast.m3u.tmp"

          with open(file, "r", encoding="utf-8-sig") as f:
              text = f.read()

          text = re.sub(
              r'tvg-name="该频道节目单尚无",([^,\r\n]+)',
              r'tvg-name="\1",\1',
              text
          )

          with open(file, "w", encoding="utf-8") as f:
              f.write(text)
          PY

          # 直接生成/覆盖仓库文件
          cp -f "$TEMP" "$FILE"

          rm -f "$TEMP"

          echo "IPTV-Unicom-Multicast.m3u generated successfully."

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add IPTV-Unicom-Multicast.m3u

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update IPTV-Unicom-Multicast.m3u"
          git push
