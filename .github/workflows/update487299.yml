name: TXT2M3U

on:
  workflow_dispatch:

  schedule:
    # 北京时间每周一 20:00
    - cron: "0 12 * * 1"

# GitHub Actions 最长运行 5 分钟
permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    # 防止整个 Job 卡死
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 下载并转换 TXT
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_URL="http://45.192.97.170:5211/487299"
          OUTPUT="IPTV.m3u"
          TMP="IPTV.m3u.tmp"
          SOURCE="source.txt"

          echo "========================================"
          echo "开始处理 IPTV"
          echo "源地址: $SOURCE_URL"
          echo "========================================"

          # 清理旧临时文件
          rm -f "$SOURCE" "$TMP"

          echo "正在下载源列表..."

          # --connect-timeout：连接最多等待 10 秒
          # --max-time：整个下载最多 30 秒
          # --fail：HTTP 错误直接失败
          if ! curl \
            --location \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --max-filesize 10M \
            -A "Mozilla/5.0" \
            "$SOURCE_URL" \
            -o "$SOURCE"; then

            echo ""
            echo "❌ 源已失效：无法下载源列表"
            echo "URL: $SOURCE_URL"
            exit 1
          fi

          # 文件为空
          if [ ! -s "$SOURCE" ]; then
            echo ""
            echo "❌ 源已失效：下载内容为空"
            exit 1
          fi

          echo "源下载成功"
          echo "源文件大小: $(wc -c < "$SOURCE") bytes"

          # 开始生成临时 M3U
          echo "#EXTM3U" > "$TMP"

          group=""
          count=0

          while IFS= read -r line || [ -n "$line" ]; do

            # 去掉首尾空白
            line="$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"

            # 跳过空行
            [ -z "$line" ] && continue

            # 分组
            if [[ "$line" == *,#genre# ]]; then
              group="${line%,#genre#}"
              continue
            fi

            # 频道
            if [[ "$line" == *,* ]]; then
              name="${line%%,*}"
              url="${line#*,}"

              # 防止异常数据
              if [ -z "$name" ] || [ -z "$url" ]; then
                continue
              fi

              echo "#EXTINF:-1 group-title=\"$group\",$name" >> "$TMP"
              echo "$url" >> "$TMP"

              count=$((count + 1))
            fi

          done < "$SOURCE"

          echo ""
          echo "解析完成"
          echo "频道数量: $count"

          # 没有解析出频道
          if [ "$count" -eq 0 ]; then
            echo ""
            echo "❌ 源已失效：没有解析出任何频道"
            echo "⚠️ 原 IPTV.m3u 不会被覆盖"
            rm -f "$TMP" "$SOURCE"
            exit 1
          fi

          # 基本格式检查
          if ! grep -q '^#EXTM3U$' "$TMP"; then
            echo ""
            echo "❌ 转换失败：M3U 文件头异常"
            echo "⚠️ 原 IPTV.m3u 不会被覆盖"
            rm -f "$TMP" "$SOURCE"
            exit 1
          fi

          if ! grep -q '^#EXTINF:' "$TMP"; then
            echo ""
            echo "❌ 转换失败：没有 EXTINF"
            echo "⚠️ 原 IPTV.m3u 不会被覆盖"
            rm -f "$TMP" "$SOURCE"
            exit 1
          fi

          # 所有检查通过后才覆盖正式文件
          mv "$TMP" "$OUTPUT"

          rm -f "$SOURCE"

          echo ""
          echo "========================================"
          echo "✅ 转换成功"
          echo "文件: $OUTPUT"
          echo "频道数量: $count"
          echo "========================================"

      - name: 提交更新
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add IPTV.m3u

          if git diff --cached --quiet; then
            echo "ℹ️ M3U 内容没有变化，不提交"
          else
            git commit -m "自动更新 IPTV"
            git push
            echo "✅ IPTV.m3u 已提交"
          fi
